name: Python Tests

on:
  push:
    branches: [ main, master, unit-tests ]
  pull_request:
    branches: [ main, master, unit-tests ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Установка Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Установка зависимостей
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install tensorflow numpy matplotlib  # Добавлен matplotlib
        
    - name: Запуск тестов
      run: |
        cd python
        pytest tests/ -v --cov=./